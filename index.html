<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>THE BUTTONGAME</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --red: #d90000;
            --dark-red: #9f0000;
            --black: #111;
            --gray: #777;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(
                    circle at 50% 45%,
                    rgba(220, 0, 0, 0.035),
                    transparent 35%
                ),
                #ffffff;
            color: var(--black);
            overflow-x: hidden;
        }

        /* =========================================
           WARNLICHTER
        ========================================= */

        .warning-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 82px;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 150px;

            pointer-events: none;
            z-index: 5;
        }

        .warning-light {
            position: relative;
            width: 55px;
            height: 55px;
            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 35% 30%,
                    #ff7777 0%,
                    #ff1c1c 22%,
                    #d00000 55%,
                    #7d0000 100%
                );

            border: 5px solid #eeeeee;

            box-shadow:
                0 0 8px rgba(220, 0, 0, 0.4),
                0 0 25px rgba(220, 0, 0, 0.35),
                0 0 55px rgba(220, 0, 0, 0.2);

            animation: warningPulse 1.4s infinite ease-in-out;
        }

        .warning-light::after {
            content: "";
            position: absolute;
            inset: 8px;
            border-radius: 50%;
            border-top: 2px solid rgba(255,255,255,0.35);
        }

        .warning-light:nth-child(2) {
            animation-delay: 0.7s;
        }

        @keyframes warningPulse {
            0%, 100% {
                opacity: 0.65;
                transform: scale(0.95);
                box-shadow:
                    0 0 8px rgba(220,0,0,0.3),
                    0 0 22px rgba(220,0,0,0.25),
                    0 0 40px rgba(220,0,0,0.15);
            }

            50% {
                opacity: 1;
                transform: scale(1.05);
                box-shadow:
                    0 0 12px rgba(220,0,0,0.7),
                    0 0 35px rgba(220,0,0,0.55),
                    0 0 75px rgba(220,0,0,0.3);
            }
        }

        /* =========================================
           HAUPTBEREICH
        ========================================= */

        main {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 120px 20px 70px;
        }

        .game-container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }

        /* =========================================
           TITEL
        ========================================= */

        .title {
            font-size: clamp(52px, 9vw, 105px);
            font-weight: 1000;
            letter-spacing: -6px;
            line-height: 0.9;

            color: #111;

            margin-bottom: 20px;

            text-transform: uppercase;
        }

        .title .red-o {
            color: var(--red);
            text-shadow:
                0 0 15px rgba(217,0,0,0.18);
        }

        .subtitle {
            color: #888;
            font-size: 14px;
            letter-spacing: 3px;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* =========================================
           BUTTON BEREICH
        ========================================= */

        .button-area {
            position: relative;

            width: 320px;
            height: 320px;

            margin: 55px auto 45px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .button-shadow {
            position: absolute;

            width: 230px;
            height: 230px;

            border-radius: 50%;

            background: rgba(160,0,0,0.08);

            filter: blur(35px);

            animation: buttonGlow 2.6s infinite ease-in-out;
        }

        @keyframes buttonGlow {
            0%, 100% {
                transform: scale(0.88);
                opacity: 0.55;
            }

            50% {
                transform: scale(1.18);
                opacity: 1;
            }
        }

        .red-button {
            position: relative;

            width: 205px;
            height: 205px;

            border-radius: 50%;
            border: 12px solid #e7e7e7;

            cursor: pointer;

            background:
                radial-gradient(
                    circle at 35% 25%,
                    #ff6666 0%,
                    #f51b1b 18%,
                    #c90000 52%,
                    #810000 100%
                );

            box-shadow:
                0 20px 30px rgba(0,0,0,0.2),
                inset 0 10px 14px rgba(255,255,255,0.18),
                inset 0 -18px 25px rgba(0,0,0,0.35),
                0 0 40px rgba(210,0,0,0.22);

            transition:
                transform 0.12s ease,
                box-shadow 0.12s ease;
        }

        .red-button::before {
            content: "";

            position: absolute;

            width: 70px;
            height: 35px;

            top: 28px;
            left: 43px;

            border-radius: 50%;

            background: rgba(255,255,255,0.19);

            filter: blur(5px);

            transform: rotate(-18deg);
        }

        .red-button:hover {
            transform: scale(1.04);

            box-shadow:
                0 23px 35px rgba(0,0,0,0.22),
                inset 0 10px 14px rgba(255,255,255,0.18),
                inset 0 -18px 25px rgba(0,0,0,0.35),
                0 0 70px rgba(210,0,0,0.38);
        }

        .red-button:active {
            transform: scale(0.94);
        }

        /* =========================================
           STARTBEREICH
        ========================================= */

        .question {
            font-size: 19px;
            font-weight: 800;
            margin-bottom: 18px;
        }

        .question-line {
            width: 55px;
            height: 3px;

            background: var(--red);

            margin: 0 auto 22px;

            border-radius: 10px;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .action-button {
            min-width: 230px;

            padding: 16px 25px;

            border-radius: 8px;

            border: 1px solid #d7d7d7;

            background: white;

            color: #111;

            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.4px;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .action-button:hover {
            border-color: #aaa;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
        }

        .action-button.primary {
            background: #111;
            border-color: #111;
            color: white;
        }

        .action-button.primary:hover {
            background: var(--red);
            border-color: var(--red);
        }

        .load-button {
            position: relative;
        }

        .load-button::before {
            content: "GESPEICHERT";

            position: absolute;

            top: -9px;
            right: 12px;

            padding: 3px 7px;

            background: var(--red);
            color: white;

            border-radius: 4px;

            font-size: 8px;
            letter-spacing: 1px;
        }

        /* =========================================
           FOOTER
        ========================================= */

        .footer {
            margin-top: 60px;

            color: #aaa;

            font-size: 10px;

            letter-spacing: 2px;

            text-transform: uppercase;
        }

        /* =========================================
           MODAL
        ========================================= */

        .modal-overlay {
            position: fixed;
            inset: 0;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background: rgba(0,0,0,0.55);

            backdrop-filter: blur(8px);

            z-index: 100;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            width: 100%;
            max-width: 460px;

            background: white;

            border-radius: 12px;

            padding: 35px;

            text-align: left;

            box-shadow:
                0 30px 80px rgba(0,0,0,0.3);

            animation: modalIn 0.2s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-warning {
            width: 45px;
            height: 45px;

            border-radius: 9px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(217,0,0,0.08);

            color: var(--red);

            font-size: 20px;
            font-weight: 900;

            margin-bottom: 20px;
        }

        .modal h2 {
            font-size: 25px;
            margin-bottom: 12px;
        }

        .modal p {
            color: #777;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-buttons button {
            flex: 1;

            padding: 14px;

            border-radius: 7px;

            border: 1px solid #ddd;

            background: white;

            cursor: pointer;

            font-weight: 800;
        }

        .modal-buttons button:hover {
            background: #f5f5f5;
        }

        .modal-buttons .confirm {
            background: var(--red);
            border-color: var(--red);
            color: white;
        }

        .modal-buttons .confirm:hover {
            background: #b90000;
        }

        /* =========================================
           RESPONSIVE
        ========================================= */

        @media (max-width: 650px) {

            .warning-bar {
                gap: 70px;
            }

            .warning-light {
                width: 43px;
                height: 43px;
            }

            main {
                padding-top: 105px;
            }

            .title {
                letter-spacing: -4px;
            }

            .button-area {
                width: 270px;
                height: 270px;
                margin-top: 45px;
            }

            .red-button {
                width: 175px;
                height: 175px;
            }

            .button-shadow {
                width: 210px;
                height: 210px;
            }

            .actions {
                flex-direction: column;
                align-items: stretch;
                max-width: 330px;
                margin: auto;
            }

            .action-button {
                width: 100%;
            }

            .modal {
                padding: 25px;
            }

            .modal-buttons {
                flex-direction: column;
            }
        }

    </style>
</head>

<body>

    <!-- =========================================
         WARNLICHTER
    ========================================== -->

    <div class="warning-bar">

        <div class="warning-light"></div>

        <div class="warning-light"></div>

    </div>


    <!-- =========================================
         HAUPTSEITE
    ========================================== -->

    <main>

        <div class="game-container">

            <div class="subtitle">
                Ein Spiel. Ein Button. Keine Ahnung was passiert.
            </div>

            <h1 class="title">
                THE BUTT<span class="red-o">O</span>NGAME
            </h1>


            <!-- RED BUTTON -->

            <div class="button-area">

                <div class="button-shadow"></div>

                <button
                    class="red-button"
                    onclick="firstTime()"
                    aria-label="The Button Game starten">
                </button>

            </div>


            <!-- FRAGE -->

            <div class="question-line"></div>

            <div class="question">
                Spielst du zum ersten Mal?
            </div>


            <!-- BUTTONS -->

            <div class="actions">

                <button
                    class="action-button primary"
                    onclick="firstTime()">
                    🔴 JA, ERSTES SPIEL
                </button>

                <button
                    class="action-button load-button"
                    onclick="loadGame()">
                    ▶ SPIELSTAND LADEN
                </button>

            </div>


            <div class="footer">
                THE BUTTONGAME · SYSTEM BEREIT
            </div>

        </div>

    </main>


    <!-- =========================================
         ERSTE-MAL-WARNUNG
    ========================================== -->

    <div
        class="modal-overlay"
        id="firstTimeModal">

        <div class="modal">

            <div class="modal-warning">
                !
            </div>

            <h2>
                Wirklich anfangen?
            </h2>

            <p>
                Du hast angegeben, dass du THE BUTTONGAME
                zum ersten Mal spielst.
                <br><br>
                Dein Fortschritt wird ab jetzt gespeichert.
                Bereit?
            </p>

            <div class="modal-buttons">

                <button onclick="closeModal()">
                    ABBRECHEN
                </button>

                <button
                    class="confirm"
                    onclick="startGame()">
                    SPIEL STARTEN
                </button>

            </div>

        </div>

    </div>


    <script>

        /* =========================================
           ERSTES SPIEL
        ========================================== */

        function firstTime() {

            document
                .getElementById("firstTimeModal")
                .classList.add("active");

        }


        /* =========================================
           MODAL SCHLIESSEN
        ========================================== */

        function closeModal() {

            document
                .getElementById("firstTimeModal")
                .classList.remove("active");

        }


        /* =========================================
           NEUES SPIEL
        ========================================== */

        function startGame() {

            closeModal();

            /*
             * SPÄTER:
             *
             * 1. Anmeldung öffnen
             * 2. Benutzername auswählen
             * 3. Avatar auswählen
             * 4. Spieler in Supabase speichern
             * 5. Spielstand erstellen
             * 6. game.html öffnen
             */

            alert("Als Nächstes kommt die Anmeldung + Avatar-Auswahl.");

        }


        /* =========================================
           SPIELSTAND LADEN
        ========================================== */

        function loadGame() {

            /*
             * SPÄTER:
             *
             * Gespeicherten Spieler suchen
             * und dessen Spielstand laden.
             */

            alert("Hier wird später dein gespeicherter Spielstand geladen.");

        }


        /* =========================================
           ESC = MODAL SCHLIESSEN
        ========================================== */

        document.addEventListener("keydown", function(event) {

            if (event.key === "Escape") {
                closeModal();
            }

        });


        /* =========================================
           KLICK AUSSERHALB
        ========================================== */

        document
            .getElementById("firstTimeModal")
            .addEventListener("click", function(event) {

                if (event.target === this) {
                    closeModal();
                }

            });

    </script>

</body>
</html>
