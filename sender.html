<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MTRIPS LIVE – Regie</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #07111f;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    height: 70px;
    background: linear-gradient(90deg, #111827, #1e293b);
    display: flex;
    align-items: center;
    padding: 0 25px;
    border-bottom: 2px solid #334155;
}

.logo {
    font-size: 28px;
    font-weight: bold;
}

.logo span {
    color: #ef4444;
}

main {
    max-width: 1200px;
    margin: 30px auto;
    padding: 0 20px;
}

.preview {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border: 2px solid #334155;
    position: relative;
    overflow: hidden;
}

#screen {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.station-logo {
    position: absolute;
    top: 20px;
    right: 25px;
    font-size: 25px;
    font-weight: bold;
    background: rgba(0,0,0,.55);
    padding: 8px 14px;
    border-radius: 5px;
}

.live {
    position: absolute;
    left: 20px;
    top: 20px;
    background: #dc2626;
    padding: 7px 12px;
    border-radius: 4px;
    font-weight: bold;
}

.controls {
    margin-top: 20px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

button {
    border: 0;
    padding: 14px 20px;
    background: #2563eb;
    color: white;
    font-size: 16px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

.stop {
    background: #dc2626;
}

.stop:hover {
    background: #b91c1c;
}

.status {
    margin-top: 18px;
    padding: 15px;
    background: #111827;
    border: 1px solid #334155;
}

h1 {
    margin-top: 0;
}
</style>
</head>

<body>

<header>
    <div class="logo">MTRIPS <span>LIVE</span></div>
</header>

<main>

<h1>Live-Regie</h1>

<div class="preview">

    <video id="screen" autoplay muted playsinline></video>

    <div class="live">LIVE</div>

    <div class="station-logo">
        MTRIPS LIVE
    </div>

</div>

<div class="controls">

    <button onclick="startCapture()">
        Minecraft übertragen
    </button>

    <button class="stop" onclick="stopCapture()">
        Übertragung stoppen
    </button>

</div>

<div class="status" id="status">
    Status: Noch keine Übertragung gestartet.
</div>

</main>

<script>

let stream = null;

async function startCapture() {

    try {

        stream = await navigator.mediaDevices.getDisplayMedia({
            video: {
                frameRate: 30
            },
            audio: true
        });

        const video = document.getElementById("screen");

        video.srcObject = stream;

        document.getElementById("status").innerText =
            "Status: MINECRAFT WIRD ÜBERTRAGEN";

        stream.getVideoTracks()[0].addEventListener("ended", () => {
            stopCapture();
        });

    } catch (error) {

        document.getElementById("status").innerText =
            "Status: Übertragung abgebrochen.";

        console.error(error);
    }
}

function stopCapture() {

    if (stream) {

        stream.getTracks().forEach(track => track.stop());

        stream = null;

    }

    document.getElementById("screen").srcObject = null;

    document.getElementById("status").innerText =
        "Status: Übertragung gestoppt.";
}

</script>

</body>
</html>
