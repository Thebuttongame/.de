<script>
/* =========================================================
   THE BUTTON GAME
   SPIELLOGIK
========================================================= */

const playerRaw = localStorage.getItem("buttonGamePlayer");

let player = null;

try {
    player = playerRaw ? JSON.parse(playerRaw) : null;
} catch (e) {
    player = null;
}

if (!player) {
    window.location.href = "register.html";
    throw new Error("Kein Spieler vorhanden.");
}


/* =========================================================
   SPIELSTAND
========================================================= */

let currentTask = Number(player.task_number || 1);

if (currentTask < 1) {
    currentTask = 1;
}

let score = Number(player.score || 0);

let clickCount = 0;
let puzzle1Solved = false;

let task2Phase = "clicking";

let unlockedSkins = ["default"];
let selectedSkin = "default";

let chestOpened = false;


/* =========================================================
   ELEMENTE
========================================================= */

const $ = (id) => document.getElementById(id);

const usernameEl = $("username");
const avatarEl = $("avatar");
const clickCounterEl = $("clickCounter");
const taskCounterEl = $("taskCounter");
const taskTitleEl = $("taskTitle");

const normalGame = $("normalGame");
const mainButton = $("mainButton");
const mainMessage = $("mainMessage");
const buttonCaption = $("buttonCaption");

const task1Puzzle = $("task1Puzzle");
const lock = $("lock");
const codeSubmit = $("codeSubmit");
const codeMessage = $("codeMessage");

const dontPressScreen = $("dontPressScreen");
const dontButton = $("dontButton");
const countdownEl = $("countdown");
const dontMessage = $("dontMessage");

const successScreen = $("successScreen");
const successText = $("successText");
const continueButton = $("continueButton");

const task3Screen = $("task3Screen");
const hiddenChest = $("hiddenChest");
const chestReward = $("chestReward");
const rewardButton = $("rewardButton");
const chestHint = $("chestHint");

const wardrobeButton = $("wardrobeButton");
const wardrobeScreen = $("wardrobeScreen");
const closeWardrobe = $("closeWardrobe");

const themeButton = $("themeButton");
const resetButton = $("resetButton");

const room = $("room");


/* =========================================================
   SPIELERANZEIGE
========================================================= */

if (usernameEl) {
    usernameEl.textContent = player.username || "Spieler";
}

if (avatarEl) {
    avatarEl.textContent = player.avatar || "●";
}


/* =========================================================
   LOCAL STORAGE LADEN
========================================================= */

function loadLocalGameData() {

    try {

        const saved = JSON.parse(
            localStorage.getItem("buttonGameState") || "{}"
        );

        if (saved.currentTask !== undefined) {
            currentTask = Number(saved.currentTask);
        }

        if (saved.score !== undefined) {
            score = Number(saved.score);
        }

        if (saved.clickCount !== undefined) {
            clickCount = Number(saved.clickCount);
        }

        if (saved.puzzle1Solved !== undefined) {
            puzzle1Solved = Boolean(saved.puzzle1Solved);
        }

        if (saved.task2Phase) {
            task2Phase = saved.task2Phase;
        }

        if (saved.chestOpened !== undefined) {
            chestOpened = Boolean(saved.chestOpened);
        }

    } catch (e) {
        console.warn("Spielstand konnte nicht geladen werden:", e);
    }


    try {

        const cosmetics = JSON.parse(
            localStorage.getItem("buttonGameCosmetics") || "{}"
        );

        if (Array.isArray(cosmetics.unlockedSkins)) {
            unlockedSkins = cosmetics.unlockedSkins;
        }

        if (cosmetics.selectedSkin) {
            selectedSkin = cosmetics.selectedSkin;
        }

    } catch (e) {
        console.warn("Cosmetics konnten nicht geladen werden:", e);
    }

}


/* =========================================================
   SPEICHERN
========================================================= */

function saveGame() {

    const data = {
        currentTask,
        score,
        clickCount,
        puzzle1Solved,
        task2Phase,
        chestOpened
    };

    localStorage.setItem(
        "buttonGameState",
        JSON.stringify(data)
    );

    player.score = score;
    player.task_number = currentTask;

    localStorage.setItem(
        "buttonGamePlayer",
        JSON.stringify(player)
    );
}


function saveCosmetics() {

    localStorage.setItem(
        "buttonGameCosmetics",
        JSON.stringify({
            unlockedSkins,
            selectedSkin
        })
    );

}


/* =========================================================
   STATS
========================================================= */

function updateStats() {

    if (clickCounterEl) {
        clickCounterEl.textContent = clickCount;
    }

    if (taskCounterEl) {
        taskCounterEl.textContent = currentTask;
    }

    if (usernameEl) {
        usernameEl.textContent = player.username || "Spieler";
    }

}


/* =========================================================
   SCREENS AUSBLENDEN
========================================================= */

function hideAllScreens() {

    if (normalGame) {
        normalGame.style.display = "none";
    }

    if (task1Puzzle) {
        task1Puzzle.style.display = "none";
    }

    if (dontPressScreen) {
        dontPressScreen.style.display = "none";
    }

    if (successScreen) {
        successScreen.style.display = "none";
    }

    if (task3Screen) {
        task3Screen.style.display = "none";
    }

}


/* =========================================================
   NORMALER BUTTON
========================================================= */

function showNormalGame() {

    hideAllScreens();

    if (normalGame) {
        normalGame.style.display = "flex";
    }

    if (mainButton) {
        mainButton.style.display = "flex";
    }

    if (mainMessage) {
        mainMessage.textContent = "";
    }

}


/* =========================================================
   TASK 1
========================================================= */

function showTask1() {

    currentTask = 1;

    task2Phase = "clicking";

    hideAllScreens();

    if (normalGame) {
        normalGame.style.display = "flex";
    }

    if (taskTitleEl) {
        taskTitleEl.textContent = "TASK 1";
    }

    if (buttonCaption) {
        buttonCaption.textContent = "DRÜCKEN";
    }

    if (mainButton) {
        mainButton.style.display = "flex";
    }

    if (mainMessage) {
        mainMessage.textContent = "";
    }

    updateStats();

}


/* =========================================================
   TASK 1 BUTTON
========================================================= */

function task1Click() {

    clickCount++;
    score++;

    updateStats();
    saveGame();

    if (mainMessage) {
        mainMessage.textContent =
            clickCount + " Klick" + (clickCount === 1 ? "" : "s");
    }

    /*
       Bei Klick 10 erscheint das Schloss.
    */

    if (clickCount >= 10 && !puzzle1Solved) {

        showTask1Puzzle();

    }

}


/* =========================================================
   PUZZLE
========================================================= */

function showTask1Puzzle() {

    if (normalGame) {
        normalGame.style.display = "none";
    }

    if (task1Puzzle) {
        task1Puzzle.style.display = "flex";
    }

    if (taskTitleEl) {
        taskTitleEl.textContent = "TASK 1 – CODE";
    }

    if (codeMessage) {
        codeMessage.textContent = "";
    }

}


/* =========================================================
   CODE PRÜFEN
========================================================= */

function checkCode() {

    const inputs = document.querySelectorAll(".code-input");

    let code = "";

    inputs.forEach(input => {
        code += String(input.value || "").trim();
    });

    if (code === "5831") {

        puzzle1Solved = true;

        score += 100;

        currentTask = 2;

        clickCount = 0;

        task2Phase = "clicking";

        saveGame();

        if (codeMessage) {
            codeMessage.textContent = "RICHTIG!";
        }

        setTimeout(() => {
            showTask2Clicking();
        }, 700);

    } else {

        if (codeMessage) {
            codeMessage.textContent = "FALSCHER CODE.";
        }

    }

}


/* =========================================================
   CODE INPUTS
========================================================= */

document.querySelectorAll(".code-input").forEach((input, index, inputs) => {

    input.addEventListener("input", () => {

        input.value = input.value.replace(/\D/g, "").slice(0, 1);

        if (input.value && inputs[index + 1]) {
            inputs[index + 1].focus();
        }

    });

    input.addEventListener("keydown", event => {

        if (
            event.key === "Backspace" &&
            !input.value &&
            inputs[index - 1]
        ) {
            inputs[index - 1].focus();
        }

        if (event.key === "Enter") {
            checkCode();
        }

    });

});


if (codeSubmit) {
    codeSubmit.addEventListener("click", checkCode);
}


/* =========================================================
   TASK 2 – KLICKEN
========================================================= */

function showTask2Clicking() {

    currentTask = 2;

    task2Phase = "clicking";

    hideAllScreens();

    if (normalGame) {
        normalGame.style.display = "flex";
    }

    if (taskTitleEl) {
        taskTitleEl.textContent = "TASK 2";
    }

    if (buttonCaption) {
        buttonCaption.textContent = "WEITER DRÜCKEN";
    }

    if (mainButton) {
        mainButton.style.display = "flex";
    }

    if (mainMessage) {
        mainMessage.textContent = "";
    }

    document.body.classList.remove(
        "rainbow-mode",
        "dark-game"
    );

    clickCount = 0;

    updateStats();
    saveGame();

}


/* =========================================================
   TASK 2 BUTTON
========================================================= */

function task2Click() {

    clickCount++;
    score++;

    updateStats();
    saveGame();


    /*
       5 Klicks -> Regenbogen
    */

    if (
        task2Phase === "clicking" &&
        clickCount >= 5
    ) {

        task2Phase = "rainbow";

        saveGame();

        document.body.classList.add("rainbow-mode");

        if (mainMessage) {
            mainMessage.textContent =
                "WAS PASSIERT HIER?!";
        }

        return;
    }


    /*
       4 weitere Klicks -> alles dunkel
    */

    if (
        task2Phase === "rainbow" &&
        clickCount >= 9
    ) {

        task2Phase = "dark";

        saveGame();

        document.body.classList.remove("rainbow-mode");
        document.body.classList.add("dark-game");

        if (mainMessage) {
            mainMessage.textContent =
                "";
        }

        setTimeout(() => {

            document.body.classList.remove("dark-game");

            startDontPress();

        }, 1200);

    }

}


/* =========================================================
   NICHT DRÜCKEN
========================================================= */

let dontPressTimer = null;

function startDontPress() {

    currentTask = 2;
    task2Phase = "dontpress";

    saveGame();

    hideAllScreens();

    if (dontPressScreen) {
        dontPressScreen.style.display = "flex";
    }

    if (taskTitleEl) {
        taskTitleEl.textContent = "TASK 2";
    }

    let timeLeft = 10;

    if (countdownEl) {
        countdownEl.textContent = timeLeft;
    }

    if (dontMessage) {
        dontMessage.textContent = "";
    }


    if (dontPressTimer) {
        clearInterval(dontPressTimer);
    }

    dontPressTimer = setInterval(() => {

        timeLeft--;

        if (countdownEl) {
            countdownEl.textContent = timeLeft;
        }

        if (timeLeft <= 0) {

            clearInterval(dontPressTimer);
            dontPressTimer = null;

            task2Phase = "completed";

            score += 200;

            currentTask = 3;

            saveGame();

            showSuccess();

        }

    }, 1000);

}


/* =========================================================
   NICHT DRÜCKEN BUTTON
========================================================= */

if (dontButton) {

    dontButton.addEventListener("click", () => {

        if (dontPressTimer) {
            clearInterval(dontPressTimer);
            dontPressTimer = null;
        }

        if (dontMessage) {
            dontMessage.textContent =
                "DU HAST IHN GEDRÜCKT.";
        }

        setTimeout(() => {

            resetGameOnly();

        }, 1000);

    });

}


/* =========================================================
   SUCCESS
========================================================= */

function showSuccess() {

    hideAllScreens();

    if (successScreen) {
        successScreen.style.display = "flex";
    }

    if (successText) {
        successText.textContent =
            "TASK 2 GESCHAFFT.";
    }

    if (taskTitleEl) {
        taskTitleEl.textContent = "GESCHAFFT";
    }

    updateStats();

}


/* =========================================================
   WEITER
========================================================= */

if (continueButton) {

    continueButton.addEventListener("click", () => {

        currentTask = 3;

        saveGame();

        showTask3();

    });

}


/* =========================================================
   TASK 3
========================================================= */

function showTask3() {

    currentTask = 3;

    saveGame();

    hideAllScreens();

    if (task3Screen) {
        task3Screen.style.display = "flex";
    }

    if (taskTitleEl) {
        taskTitleEl.textContent = "TASK 3";
    }

    if (chestHint) {
        if (chestOpened) {
            chestHint.textContent =
                "Du hast die Truhe bereits gefunden.";
        } else {
            chestHint.textContent =
                "Irgendwo hier ist eine Truhe versteckt...";
        }
    }

    if (hiddenChest) {

        hiddenChest.style.display =
            chestOpened ? "none" : "block";

    }

    updateStats();

}


/* =========================================================
   TRUHE
========================================================= */

if (hiddenChest) {

    hiddenChest.addEventListener("click", () => {

        if (chestOpened) {
            return;
        }

        chestOpened = true;

        unlockSkin("neon");

        score += 500;

        saveGame();

        hiddenChest.style.display = "none";

        if (chestReward) {
            chestReward.style.display = "flex";
        }

        if (chestHint) {
            chestHint.textContent =
                "TRUHE GEÖFFNET!";
        }

        updateStats();

    });

}


/* =========================================================
   COSMETIC FREISCHALTEN
========================================================= */

function unlockSkin(skin) {

    if (!unlockedSkins.includes(skin)) {
        unlockedSkins.push(skin);
    }

    selectedSkin = skin;

    saveCosmetics();

    applyButtonSkin();

}


/* =========================================================
   REWARD BUTTON
========================================================= */

if (rewardButton) {

    rewardButton.addEventListener("click", () => {

        selectedSkin = "neon";

        saveCosmetics();

        applyButtonSkin();

        if (chestReward) {
            chestReward.style.display = "none";
        }

    });

}


/* =========================================================
   BUTTON SKINS
========================================================= */

function applyButtonSkin() {

    if (!mainButton) {
        return;
    }

    mainButton.classList.remove(
        "skin-default",
        "skin-neon",
        "skin-gold",
        "skin-black"
    );

    if (selectedSkin === "neon") {
        mainButton.classList.add("skin-neon");
    }

    else if (selectedSkin === "gold") {
        mainButton.classList.add("skin-gold");
    }

    else if (selectedSkin === "black") {
        mainButton.classList.add("skin-black");
    }

    else {
        mainButton.classList.add("skin-default");
    }

}


/* =========================================================
   KLEIDERSCHRANK
========================================================= */

function openWardrobe() {

    if (!wardrobeScreen) {
        return;
    }

    wardrobeScreen.style.display = "flex";

    renderWardrobe();

}


function closeWardrobeScreen() {

    if (wardrobeScreen) {
        wardrobeScreen.style.display = "none";
    }

}


function renderWardrobe() {

    if (!wardrobeScreen) {
        return;
    }

    const cards =
        wardrobeScreen.querySelectorAll(".skin-card");

    cards.forEach(card => {

        const skin = card.dataset.skin;

        if (!skin) {
            return;
        }

        const unlocked =
            unlockedSkins.includes(skin);

        card.classList.toggle(
            "locked",
            !unlocked
        );

        card.classList.toggle(
            "selected",
            skin === selectedSkin
        );

    });

}


if (wardrobeButton) {
    wardrobeButton.addEventListener(
        "click",
        openWardrobe
    );
}


if (closeWardrobe) {
    closeWardrobe.addEventListener(
        "click",
        closeWardrobeScreen
    );
}


document.querySelectorAll(".skin-card").forEach(card => {

    card.addEventListener("click", () => {

        const skin = card.dataset.skin;

        if (!skin) {
            return;
        }

        if (!unlockedSkins.includes(skin)) {
            return;
        }

        selectedSkin = skin;

        saveCosmetics();

        applyButtonSkin();

        renderWardrobe();

    });

});


/* =========================================================
   DRAGGABLE ELEMENTE
========================================================= */

function makeDraggable(element) {

    if (!element) {
        return;
    }

    let dragging = false;

    let offsetX = 0;
    let offsetY = 0;


    function startDrag(event) {

        dragging = true;

        const rect =
            element.getBoundingClientRect();

        const point =
            event.touches
                ? event.touches[0]
                : event;

        offsetX =
            point.clientX - rect.left;

        offsetY =
            point.clientY - rect.top;

        element.style.position = "fixed";

        element.style.zIndex = "9999";

        event.preventDefault();

    }


    function moveDrag(event) {

        if (!dragging) {
            return;
        }

        const point =
            event.touches
                ? event.touches[0]
                : event;

        element.style.left =
            (point.clientX - offsetX) + "px";

        element.style.top =
            (point.clientY - offsetY) + "px";

        event.preventDefault();

    }


    function stopDrag() {

        dragging = false;

    }


    element.addEventListener(
        "mousedown",
        startDrag
    );

    document.addEventListener(
        "mousemove",
        moveDrag
    );

    document.addEventListener(
        "mouseup",
        stopDrag
    );


    element.addEventListener(
        "touchstart",
        startDrag,
        { passive: false }
    );

    document.addEventListener(
        "touchmove",
        moveDrag,
        { passive: false }
    );

    document.addEventListener(
        "touchend",
        stopDrag
    );

}


makeDraggable(lock);

document.querySelectorAll(".draggable").forEach(
    makeDraggable
);


/* =========================================================
   HAUPTBUTTON
========================================================= */

if (mainButton) {

    mainButton.addEventListener("click", () => {

        if (currentTask === 1) {
            task1Click();
        }

        else if (
            currentTask === 2 &&
            task2Phase !== "dontpress"
        ) {
            task2Click();
        }

    });

}


/* =========================================================
   DARKMODE
========================================================= */

function applyTheme() {

    const dark =
        localStorage.getItem("buttonGameDarkmode")
        === "true";

    document.body.classList.toggle(
        "dark-mode",
        dark
    );

}


if (themeButton) {

    themeButton.addEventListener("click", () => {

        const dark =
            document.body.classList.contains(
                "dark-mode"
            );

        localStorage.setItem(
            "buttonGameDarkmode",
            String(!dark)
        );

        applyTheme();

    });

}


/* =========================================================
   RESET
========================================================= */

function resetGameOnly() {

    if (dontPressTimer) {
        clearInterval(dontPressTimer);
        dontPressTimer = null;
    }

    currentTask = 1;

    score = 0;

    clickCount = 0;

    puzzle1Solved = false;

    task2Phase = "clicking";

    chestOpened = false;

    saveGame();

    document.body.classList.remove(
        "rainbow-mode",
        "dark-game"
    );

    showTask1();

}


if (resetButton) {

    resetButton.addEventListener("click", () => {

        const confirmed =
            confirm(
                "Wirklich den gesamten Spielstand zurücksetzen?"
            );

        if (!confirmed) {
            return;
        }

        resetGameOnly();

    });

}


/* =========================================================
   TASTATUR
========================================================= */

document.addEventListener("keydown", event => {

    if (
        event.key === "Escape" &&
        wardrobeScreen &&
        wardrobeScreen.style.display !== "none"
    ) {
        closeWardrobeScreen();
    }

});


/* =========================================================
   START
========================================================= */

loadLocalGameData();

applyTheme();

applyButtonSkin();

updateStats();


/*
   Welchen Bildschirm anzeigen?
*/

if (currentTask === 1) {

    if (puzzle1Solved) {

        currentTask = 2;

        clickCount = 0;

        task2Phase = "clicking";

        saveGame();

        showTask2Clicking();

    } else {

        showTask1();

    }

}

else if (currentTask === 2) {

    if (task2Phase === "dontpress") {

        startDontPress();

    } else {

        showTask2Clicking();

    }

}

else if (currentTask >= 3) {

    showTask3();

}

</script>
