<script>

/* =========================================================
   SPIELER
========================================================= */

const playerRaw = localStorage.getItem("buttonGamePlayer");

let player = null;

try {
    player = playerRaw ? JSON.parse(playerRaw) : null;
} catch {
    player = null;
}

if (!player) {
    window.location.href = "register.html";
}


/* =========================================================
   ELEMENTE
========================================================= */

const usernameElement = document.getElementById("username");
const avatarElement = document.getElementById("avatar");

const clickCounter = document.getElementById("clickCounter");
const taskCounter = document.getElementById("taskCounter");
const taskTitle = document.getElementById("taskTitle");

const normalGame = document.getElementById("normalGame");
const mainButton = document.getElementById("mainButton");
const mainMessage = document.getElementById("mainMessage");
const buttonCaption = document.getElementById("buttonCaption");

const task1Puzzle = document.getElementById("task1Puzzle");
const lock = document.getElementById("lock");

const codeInputs = document.querySelectorAll(".code-input");
const codeSubmit = document.getElementById("codeSubmit");
const codeMessage = document.getElementById("codeMessage");

const dontPressScreen = document.getElementById("dontPressScreen");
const dontButton = document.getElementById("dontButton");
const countdownElement = document.getElementById("countdown");
const dontMessage = document.getElementById("dontMessage");

const successScreen = document.getElementById("successScreen");
const successText = document.getElementById("successText");
const continueButton = document.getElementById("continueButton");

const task3Screen = document.getElementById("task3Screen");

const hiddenChest = document.getElementById("hiddenChest");
const chestReward = document.getElementById("chestReward");
const rewardButton = document.getElementById("rewardButton");
const chestHint = document.getElementById("chestHint");

const wardrobeButton = document.getElementById("wardrobeButton");
const wardrobeScreen = document.getElementById("wardrobeScreen");
const closeWardrobe = document.getElementById("closeWardrobe");

const themeButton = document.getElementById("themeButton");
const resetButton = document.getElementById("resetButton");


/* =========================================================
   SPIELSTAND
========================================================= */

let clickCount =
    Number(localStorage.getItem("buttonGameClicks")) || 0;

let currentTask =
    Number(localStorage.getItem("buttonGameTask")) || 1;

let puzzle1Solved =
    localStorage.getItem("buttonGamePuzzle1Solved") === "true";

let task2Phase =
    localStorage.getItem("buttonGameTask2Phase") || "clicking";

let task3ChestFound =
    localStorage.getItem("buttonGameChestFound") === "true";


/* =========================================================
   COSMETICS
========================================================= */

let selectedSkin =
    localStorage.getItem("buttonGameSkin") || "default";

let unlockedSkins;

try {

    unlockedSkins = JSON.parse(
        localStorage.getItem("buttonGameUnlockedSkins")
        || '["default"]'
    );

} catch {

    unlockedSkins = ["default"];

}

if (!unlockedSkins.includes("default")) {
    unlockedSkins.push("default");
}


/* =========================================================
   SPIELER ANZEIGEN
========================================================= */

usernameElement.textContent =
    player?.username || "Spieler";


const avatarColors = {

    red: "#e00000",
    blue: "#1479ff",
    green: "#12a84b",
    purple: "#7b35d6",
    yellow: "#ffd000",
    black: "#111"

};

avatarElement.style.background =
    avatarColors[player?.avatar] || "#e00000";


/* =========================================================
   SPEICHERN
========================================================= */

function saveGame() {

    localStorage.setItem(
        "buttonGameClicks",
        String(clickCount)
    );

    localStorage.setItem(
        "buttonGameTask",
        String(currentTask)
    );

    localStorage.setItem(
        "buttonGamePuzzle1Solved",
        String(puzzle1Solved)
    );

    localStorage.setItem(
        "buttonGameTask2Phase",
        task2Phase
    );

    localStorage.setItem(
        "buttonGameChestFound",
        String(task3ChestFound)
    );

}


/* =========================================================
   STATS
========================================================= */

function updateStats() {

    clickCounter.textContent = clickCount;
    taskCounter.textContent = currentTask;

}


/* =========================================================
   DARKMODE
========================================================= */

let darkMode =
    localStorage.getItem("buttonGameDarkMode") === "true";


function applyTheme() {

    document.body.classList.toggle(
        "dark",
        darkMode
    );

    themeButton.textContent =
        darkMode ? "☀️" : "🎨";

}


themeButton.addEventListener("click", () => {

    darkMode = !darkMode;

    localStorage.setItem(
        "buttonGameDarkMode",
        String(darkMode)
    );

    applyTheme();

});


applyTheme();


/* =========================================================
   ALLE SCREENS VERSTECKEN
========================================================= */

function hideAllScreens() {

    normalGame.classList.add("hidden");
    task1Puzzle.classList.add("hidden");
    dontPressScreen.classList.add("hidden");
    successScreen.classList.add("hidden");
    task3Screen.classList.add("hidden");
    wardrobeScreen.classList.add("hidden");

}


/* =========================================================
   AUFGABE 1
========================================================= */

function showTask1() {

    hideAllScreens();

    document.body.classList.remove("rainbow");
    document.body.classList.remove("blackout");

    taskTitle.textContent = "AUFGABE 1";

    normalGame.classList.remove("hidden");

    mainButton.textContent = "DRÜCKEN";

    buttonCaption.textContent =
        "Irgendwann passiert etwas.";

    mainMessage.textContent = "";

    updateStats();
    applyButtonSkin();

}


/* =========================================================
   AUFGABE 1 BUTTON
========================================================= */

mainButton.addEventListener("click", () => {

    if (currentTask !== 1) {
        return;
    }

    if (puzzle1Solved) {
        return;
    }

    clickCount++;

    updateStats();
    saveGame();

    if (clickCount < 10) {

        mainMessage.textContent =
            `${10 - clickCount} Klicks bis etwas passiert.`;

        return;
    }

    if (clickCount === 10) {

        mainMessage.textContent =
            "Etwas hat sich verändert.";

        setTimeout(() => {
            startTask1Puzzle();
        }, 400);

    }

});


/* =========================================================
   TASK 1 SCHLOSS
========================================================= */

function startTask1Puzzle() {

    hideAllScreens();

    taskTitle.textContent =
        "AUFGABE 1 · RÄTSEL";

    task1Puzzle.classList.remove("hidden");

    codeMessage.textContent = "";

    lock.style.transform =
        "translateX(-50%) translateY(0px)";

    codeInputs.forEach(input => {
        input.value = "";
    });

    codeInputs[0].focus();

}


/* =========================================================
   CODE-EINGABE
========================================================= */

codeInputs.forEach((input, index) => {

    input.addEventListener("input", () => {

        input.value =
            input.value.replace(/[^0-9]/g, "");

        if (
            input.value &&
            index < codeInputs.length - 1
        ) {

            codeInputs[index + 1].focus();

        }

    });


    input.addEventListener("keydown", event => {

        if (
            event.key === "Backspace" &&
            !input.value &&
            index > 0
        ) {

            codeInputs[index - 1].focus();

        }

    });

});


/* =========================================================
   CODE PRÜFEN
========================================================= */

codeSubmit.addEventListener("click", checkCode);


function checkCode() {

    const code =
        Array.from(codeInputs)
            .map(input => input.value)
            .join("");

    if (code === "5831") {

        codeMessage.textContent =
            "✓ Richtig.";

        puzzle1Solved = true;

        currentTask = 2;

        clickCount = 0;

        task2Phase = "clicking";

        saveGame();

        setTimeout(() => {

            showTask2Clicking();

        }, 700);

    } else {

        codeMessage.textContent =
            "Falscher Code.";

        codeInputs.forEach(input => {
            input.value = "";
        });

        codeInputs[0].focus();

    }

}


/* =========================================================
   SCHLOSS DRAGGEN
========================================================= */

let draggingLock = false;
let startY = 0;
let lockOffset = 0;


lock.addEventListener("pointerdown", event => {

    draggingLock = true;

    startY = event.clientY;

    lock.setPointerCapture(
        event.pointerId
    );

});


lock.addEventListener("pointermove", event => {

    if (!draggingLock) {
        return;
    }

    const difference =
        event.clientY - startY;

    lockOffset =
        Math.max(
            0,
            Math.min(
                250,
                difference
            )
        );

    lock.style.transform =
        `translateX(-50%) translateY(${lockOffset}px)`;

});


lock.addEventListener("pointerup", () => {

    draggingLock = false;

    if (lockOffset > 100) {

        lock.style.transform =
            "translateX(-50%) translateY(250px)";

    } else {

        lockOffset = 0;

        lock.style.transform =
            "translateX(-50%) translateY(0px)";

    }

});


/* =========================================================
   AUFGABE 2 START
========================================================= */

function showTask2Clicking() {

    hideAllScreens();

    document.body.classList.remove("rainbow");
    document.body.classList.remove("blackout");

    taskTitle.textContent =
        "AUFGABE 2";

    normalGame.classList.remove("hidden");

    mainButton.textContent =
        "DRÜCKEN";

    buttonCaption.textContent =
        "Was passiert nach dem nächsten Klick?";

    mainMessage.textContent = "";

    updateStats();
    applyButtonSkin();

}


/* =========================================================
   AUFGABE 2 KLICKS
========================================================= */

mainButton.addEventListener("click", () => {

    if (currentTask !== 2) {
        return;
    }


    if (task2Phase === "clicking") {

        clickCount++;

        updateStats();
        saveGame();


        /*
           Klick 1–4
        */

        if (clickCount < 5) {

            mainMessage.textContent =
                `${5 - clickCount} Klicks bis zum Rainbow-Effekt.`;

            return;

        }


        /*
           Klick 5:
           RAINBOW
        */

        if (clickCount === 5) {

            task2Phase = "rainbow";

            saveGame();

            document.body.classList.add(
                "rainbow"
            );

            mainMessage.textContent =
                "🌈 ALLES WIRD BUNT.";

            return;

        }

    }


    /*
       NACH RAINBOW:
       4 WEITERE KLICKS
    */

    if (task2Phase === "rainbow") {

        clickCount++;

        updateStats();
        saveGame();


        const additionalClicks =
            clickCount - 5;


        if (additionalClicks < 4) {

            mainMessage.textContent =
                `${4 - additionalClicks} weitere Klicks.`;

            return;

        }


        /*
           ALLES AUS
        */

        task2Phase = "dark";

        saveGame();

        startDarkPhase();

    }

});


/* =========================================================
   ALLES WIRD DUNKEL
========================================================= */

function startDarkPhase() {

    document.body.classList.remove(
        "rainbow"
    );

    document.body.classList.add(
        "blackout"
    );


    setTimeout(() => {

        document.body.classList.remove(
            "blackout"
        );

        clickCount = 0;

        task2Phase = "dontpress";

        saveGame();

        startDontPress();

    }, 1800);

}


/* =========================================================
   NICHT DRÜCKEN
========================================================= */

let countdownTimer = null;


function startDontPress() {

    hideAllScreens();

    taskTitle.textContent =
        "AUFGABE 2 · NICHT DRÜCKEN";

    dontPressScreen.classList.remove(
        "hidden"
    );


    let timeLeft = 10;

    countdownElement.textContent =
        timeLeft;

    dontMessage.textContent = "";


    clearInterval(countdownTimer);


    countdownTimer = setInterval(() => {

        timeLeft--;

        countdownElement.textContent =
            timeLeft;


        if (timeLeft <= 0) {

            clearInterval(countdownTimer);

            finishTask2();

        }

    }, 1000);

}


/* =========================================================
   NICHT-DRÜCKEN-BUTTON
========================================================= */

dontButton.addEventListener("click", () => {

    clearInterval(countdownTimer);

    dontMessage.textContent =
        "DU HAST IHN GEDRÜCKT.";

    setTimeout(() => {

        restartWholeGame();

    }, 900);

});


/* =========================================================
   AUFGABE 2 GESCHAFFT
========================================================= */

function finishTask2() {

    currentTask = 3;

    clickCount = 0;

    task2Phase = "finished";

    saveGame();

    showTask3();

}


/* =========================================================
   AUFGABE 3
========================================================= */

function showTask3() {

    hideAllScreens();

    taskTitle.textContent =
        "AUFGABE 3";

    task3Screen.classList.remove(
        "hidden"
    );

    updateStats();


    if (task3ChestFound) {

        chestHint.textContent =
            "Truhe bereits gefunden.";

        hiddenChest.classList.add(
            "visible"
        );

    } else {

        chestHint.textContent =
            "Bewege die Gegenstände und finde die Truhe.";

    }

}


/* =========================================================
   BEWEGBARE GEGENSTÄNDE
========================================================= */

const draggableObjects =
    document.querySelectorAll(".draggable");


draggableObjects.forEach(element => {

    let dragging = false;

    let offsetX = 0;
    let offsetY = 0;


    element.addEventListener("pointerdown", event => {

        dragging = true;

        element.setPointerCapture(
            event.pointerId
        );


        const rect =
            element.getBoundingClientRect();


        offsetX =
            event.clientX - rect.left;

        offsetY =
            event.clientY - rect.top;

    });


    element.addEventListener("pointermove", event => {

        if (!dragging) {
            return;
        }


        const room =
            document.getElementById("room");


        const roomRect =
            room.getBoundingClientRect();


        let x =
            event.clientX -
            roomRect.left -
            offsetX;


        let y =
            event.clientY -
            roomRect.top -
            offsetY;


        x = Math.max(
            0,
            Math.min(
                roomRect.width -
                element.offsetWidth,
                x
            )
        );


        y = Math.max(
            0,
            Math.min(
                roomRect.height -
                element.offsetHeight,
                y
            )
        );


        element.style.left =
            `${x}px`;

        element.style.top =
            `${y}px`;

        element.style.right =
            "auto";

        element.style.bottom =
            "auto";


        checkChestVisibility();

    });


    element.addEventListener("pointerup", () => {

        dragging = false;

        checkChestVisibility();

    });

});


/* =========================================================
   TRUHE SICHTBARKEIT
========================================================= */

function checkChestVisibility() {

    if (task3ChestFound) {
        return;
    }


    const room =
        document.getElementById("room");


    const chestRect =
        hiddenChest.getBoundingClientRect();


    const objects =
        Array.from(
            room.querySelectorAll(".draggable")
        );


    let uncovered = true;


    for (const object of objects) {

        const rect =
            object.getBoundingClientRect();


        const overlap =
            !(
                rect.right < chestRect.left ||
                rect.left > chestRect.right ||
                rect.bottom < chestRect.top ||
                rect.top > chestRect.bottom
            );


        if (overlap) {

            uncovered = false;

            break;

        }

    }


    if (uncovered) {

        hiddenChest.classList.add(
            "visible"
        );

        chestHint.textContent =
            "👀 DA IST ETWAS!";

    } else {

        hiddenChest.classList.remove(
            "visible"
        );

        chestHint.textContent =
            "Bewege die Gegenstände und finde die Truhe.";

    }

}


/* =========================================================
   TRUHE ÖFFNEN
========================================================= */

hiddenChest.addEventListener("click", () => {

    if (
        !hiddenChest.classList.contains("visible")
    ) {

        return;

    }


    if (task3ChestFound) {

        openChestReward();

        return;

    }


    task3ChestFound = true;


    /*
       NEON ROT DAUERHAFT FREISCHALTEN
    */

    if (!unlockedSkins.includes("neon")) {

        unlockedSkins.push("neon");

    }


    localStorage.setItem(
        "buttonGameUnlockedSkins",
        JSON.stringify(unlockedSkins)
    );


    saveGame();


    hiddenChest.classList.add(
        "found"
    );


    chestHint.textContent =
        "🎉 TRUHE GEÖFFNET!";


    openChestReward();

});


/* =========================================================
   TRUHEN-REWARD
========================================================= */

function openChestReward() {

    chestReward.classList.remove(
        "hidden"
    );

}


rewardButton.addEventListener("click", () => {

    chestReward.classList.add(
        "hidden"
    );

    openWardrobe();

});


/* =========================================================
   KLEIDERSCHRANK
========================================================= */

function openWardrobe() {

    hideAllScreens();

    taskTitle.textContent =
        "KLEIDERSCHRANK";

    wardrobeScreen.classList.remove(
        "hidden"
    );

    updateWardrobe();

}


function updateWardrobe() {

    document.querySelectorAll(".skin-card")
        .forEach(card => {

            const skin =
                card.dataset.skin;


            const unlocked =
                unlockedSkins.includes(
                    skin
                );


            card.classList.toggle(
                "locked",
                !unlocked
            );


            card.classList.toggle(
                "active",
                selectedSkin === skin
            );


            const status =
                card.querySelector("span");


            if (unlocked) {

                status.textContent =
                    "Freigeschaltet";

            } else {

                status.textContent =
                    "🔒 Noch nicht gefunden";

            }

        });


    applyButtonSkin();

}


/* =========================================================
   BUTTON-SKIN
========================================================= */

function applyButtonSkin() {

    mainButton.classList.remove(
        "button-skin-neon",
        "button-skin-rainbow",
        "button-skin-ice",
        "button-skin-matrix",
        "button-skin-gold"
    );


    if (selectedSkin === "neon") {

        mainButton.classList.add(
            "button-skin-neon"
        );

    }


    if (selectedSkin === "rainbow") {

        mainButton.classList.add(
            "button-skin-rainbow"
        );

    }


    if (selectedSkin === "ice") {

        mainButton.classList.add(
            "button-skin-ice"
        );

    }


    if (selectedSkin === "matrix") {

        mainButton.classList.add(
            "button-skin-matrix"
        );

    }


    if (selectedSkin === "gold") {

        mainButton.classList.add(
            "button-skin-gold"
        );

    }

}


/* =========================================================
   SKINS AUSWÄHLEN
========================================================= */

document.querySelectorAll(".skin-card")
    .forEach(card => {

        card.addEventListener("click", () => {

            const skin =
                card.dataset.skin;


            if (
                !unlockedSkins.includes(skin)
            ) {

                return;

            }


            selectedSkin = skin;


            localStorage.setItem(
                "buttonGameSkin",
                selectedSkin
            );


            updateWardrobe();

        });

    });


/* =========================================================
   KLEIDERSCHRANK ÖFFNEN
========================================================= */

wardrobeButton.addEventListener("click", () => {

    openWardrobe();

});


/* =========================================================
   KLEIDERSCHRANK SCHLIESSEN
========================================================= */

closeWardrobe.addEventListener("click", () => {

    wardrobeScreen.classList.add(
        "hidden"
    );


    if (currentTask === 1) {

        showTask1();

    } else if (currentTask === 2) {

        if (task2Phase === "dontpress") {

            startDontPress();

        } else {

            showTask2Clicking();

        }

    } else {

        showTask3();

    }

});


/* =========================================================
   RESET ALL
========================================================= */

resetButton.addEventListener("click", () => {

    const confirmed =
        confirm(
            "Willst du wirklich den kompletten Spielverlauf zurücksetzen?"
        );


    if (!confirmed) {
        return;
    }


    restartWholeGame();

});


function restartWholeGame() {

    clearInterval(countdownTimer);


    clickCount = 0;

    currentTask = 1;

    puzzle1Solved = false;

    task2Phase = "clicking";

    task3ChestFound = false;


    localStorage.removeItem(
        "buttonGameClicks"
    );

    localStorage.removeItem(
        "buttonGameTask"
    );

    localStorage.removeItem(
        "buttonGamePuzzle1Solved"
    );

    localStorage.removeItem(
        "buttonGameTask2Phase"
    );

    localStorage.removeItem(
        "buttonGameChestFound"
    );


    /*
       WICHTIG:

       Die freigeschalteten Cosmetics
       BLEIBEN ERHALTEN.

       Auch NEON ROT bleibt nach RESET ALL
       im Kleiderschrank.
    */


    document.body.classList.remove(
        "rainbow"
    );

    document.body.classList.remove(
        "blackout"
    );


    hiddenChest.classList.remove(
        "visible"
    );

    hiddenChest.classList.remove(
        "found"
    );

    chestReward.classList.add(
        "hidden"
    );


    saveGame();

    showTask1();

}


/* =========================================================
   STARTZUSTAND
========================================================= */

updateStats();

applyButtonSkin();


if (currentTask === 1) {

    if (puzzle1Solved) {

        currentTask = 2;

        clickCount = 0;

        task2Phase = "clicking";

        saveGame();

        showTask2Clicking();

    } else {

        showTask1();

    }

}


else if (currentTask === 2) {

    if (task2Phase === "dontpress") {

        startDontPress();

    } else {

        /*
           Bei einem Reload während Rainbow/Dark
           wird Aufgabe 2 sauber neu gestartet.
        */

        if (
            task2Phase === "rainbow" ||
            task2Phase === "dark"
        ) {

            clickCount = 0;

            task2Phase = "clicking";

            saveGame();

        }

        showTask2Clicking();

    }

}


else if (currentTask >= 3) {

    showTask3();

}

</script>
